[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumlab-api"
version = "2.0.0"
description = "QuantHub API: projects, files, experiments, and the quantum simulator core bridge."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QuantumLab Contributors" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "google-genai>=0.7",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "qiskit>=1.0",
    "pennylane>=0.36",
    "qdk>=1.31",
    # Server-side Firebase ID token verification (fail-closed if absent).
    "firebase-admin>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
