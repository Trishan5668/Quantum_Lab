[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumlab-api"
version = "2.0.0"
description = "FastAPI bridge between QuantumLab desktop client and the quantum simulator core."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QuantumLab Contributors" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "google-genai>=0.7",
    "numpy>=1.26",
    "quantumlab>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
