name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (core + api)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "quantum-simulator-core[dev]"
          python -m pip install -e "fastapi-server[dev]"
      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check quantum-simulator-core/quantumlab quantum-simulator-core/tests fastapi-server/app fastapi-server/tests
      - name: Typecheck (mypy strict, core only)
        run: |
          cd quantum-simulator-core
          set -o pipefail
          python -m mypy quantumlab --show-error-codes --no-pretty 2>&1 | tee mypy-report.txt
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report-py${{ matrix.python }}
          path: quantum-simulator-core/mypy-report.txt
          if-no-files-found: ignore
      - name: Test
        run: |
          cd quantum-simulator-core && python -m pytest -q && cd ..
          cd fastapi-server && python -m pytest -q

  research-gates:
    name: Research gates (Stim/PyMatching)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "quantum-simulator-core[dev,research]"
          python -m pip install "stim==1.16.0" "pymatching==2.4.0"
      - name: Gate A - lint and typecheck
        working-directory: quantum-simulator-core
        run: |
          ruff check quantumlab tests research/qec/scripts research/qec/benchmarks
          python -m mypy quantumlab
      - name: Gate B - unit and integration tests
        working-directory: quantum-simulator-core
        run: python -m pytest -q
      - name: Gate C - executable capability audit and protocol validation
        working-directory: quantum-simulator-core
        run: |
          python -m quantumlab.research.qec audit > /tmp/qec_audit.json
          python -m quantumlab.research.qec validate research/qec/protocols/code_capacity_repetition_d5.yaml
      - name: Gate D - committed artifact integrity and claims
        working-directory: quantum-simulator-core
        run: |
          python research/qec/scripts/verify_artifacts.py
          latest=$(ls -d research/qec/results/raw/2026*/ | sort | tail -1)
          python -m quantumlab.research.qec claims "$latest"
      - name: Gate E - reproduction of the pre-declared target
        working-directory: quantum-simulator-core
        run: |
          python -m quantumlab.research.qec reproduce \
            research/qec/reproduction/surface_code_threshold_v1.yaml \
            --output /tmp/qec_reproduction > /tmp/qec_reproduction.json
          python - <<'PY'
          import json, pathlib
          payload = json.loads(pathlib.Path("/tmp/qec_reproduction.json").read_text())
          assert payload["status"] == "REPRODUCED", payload
          print(payload["claim_label"], payload["bracket"])
          PY
      - name: Gate E - independent validation suite
        working-directory: quantum-simulator-core
        run: |
          python -m quantumlab.research.qec validate-suite --output /tmp/qec_validation \
            > /tmp/qec_validation.json
          python - <<'PY'
          import json, pathlib
          payload = json.loads(pathlib.Path("/tmp/qec_validation.json").read_text())
          assert payload["overall_status"].startswith("PASS"), payload["overall_status"]
          print(payload["overall_status"])
          PY

  frontend:
    name: Frontend (webapp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          cd quantum-desktop-app/packages/webapp
          npm ci
      - name: Typecheck
        run: |
          cd quantum-desktop-app/packages/webapp
          npx tsc --noEmit
      - name: Test
        run: |
          cd quantum-desktop-app/packages/webapp
          npm test -- --run
